name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-organize files into Android structure
        run: |
          # ফোল্ডার তৈরি
          mkdir -p app/src/main/java/world/gatepay/sms
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # সব কোড ও রিসোর্স ফাইল নির্দিষ্ট ফোল্ডারে সরানো
          find . -maxdepth 1 -name "*.kt" -exec mv -f {} app/src/main/java/world/gatepay/sms/ \;
          [ -f colors.xml ] && mv -f colors.xml app/src/main/res/values/
          [ -f ic_app.xml ] && mv -f ic_app.xml app/src/main/res/drawable/
          [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml app/src/main/

          # সঠিক settings.gradle.kts কনফিগার করা
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GatePaySMS"
          include(":app")
          EOF

          # সঠিক রুট build.gradle.kts কনফিগার করা
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # সঠিক app/build.gradle.kts কনফিগার করা
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "world.gatepay.sms"
              compileSdk = 34

              defaultConfig {
                  applicationId = "world.gatepay.sms"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0.0"
                  buildConfigField("String", "API_URL", "\"https://zazpdfjefmcfdqhuhhkj.supabase.co/functions/v1/sms-listener\"")
              }

              buildFeatures {
                  buildConfig = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }

      - run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: GatePaySMS-apk, path: app/build/outputs/apk/debug/*.apk }
        
