name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check folder structure
        run: |
          if [ -d "gatepay-sms" ]; then
            echo "Moving files from gatepay-sms to root..."
            shopt -s dotglob
            mv gatepay-sms/* .
            rmdir gatepay-sms 2>/dev/null || true
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }

      - run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: GatePaySMS-apk, path: app/build/outputs/apk/debug/*.apk }
        
